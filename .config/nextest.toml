# nextest config. `.github/workflows/ci.yml` runs the `ci` profile; the
# default profile keeps local `cargo nextest run` fast.
#
# The daemon/proxy integration tests each boot a full daemon (control
# plane + proxy listener + supervised tasks). Several booting at once
# oversubscribe a 3-4 core CI runner and starve a listener past its
# readiness deadline -- the off-Linux flake. libtest's per-binary
# `--test-threads` can't bound concurrency across binaries; nextest's
# global scheduler + a test-group can.

# Bound how many daemon-spawning tests run at once across the WHOLE run
# (not per-binary). Assigned to the matching binaries via the override
# below; every test binary that boots a daemon belongs in that filter.
# 8, not 4: several of these tests mostly sleep (SIGTERM drains, ready
# timeouts), and at 4 they queued behind each other, adding ~10 s to a
# ~16 s local run. A 3-4 core CI runner never reaches 8 anyway.
[test-groups]
daemon-bound = { max-threads = 8 }
# `session_cli`, `cli_integration_test` and `cli_bench` boot their daemons through the CLI, and a CLI daemon binds the
# control plane on `DEFAULT_CONTROL_PORT` and only probes 5 ports above it. That
# one window is shared by every daemon on the host — including a developer's own
# running daemon — so a sixth daemon at once exits 71 before binding. Four leaves
# room for the developer's daemon plus a spare.
control-plane-bound = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(/^(session_|cli_integration|cli_bench)/)'
test-group = 'control-plane-bound'

[[profile.default.overrides]]
filter = 'binary(/^(proxy_|daemon_|control_plane|supervisor_|start_model|tui_|init_orchestration|list_models|uat_lifecycle|generic_backend|generic_rows_from|preset_config_ipc|sglang_backend|vllm_backend)/)'
test-group = 'daemon-bound'

[profile.ci]
# Retry environmental flake (a port-reuse race, a slow-runner deadline
# miss) instead of failing the run; a real logic bug fails every attempt.
retries = 2
fail-fast = false
# Flag slow tests and terminate a genuinely hung one rather than waiting
# out the job timeout.
slow-timeout = { period = "60s", terminate-after = 3 }

# Profile overrides don't inherit the default profile's, so repeat the
# daemon-bound assignment here for the CI profile.
[[profile.ci.overrides]]
filter = 'binary(/^(proxy_|daemon_|control_plane|supervisor_|start_model|tui_|init_orchestration|list_models|uat_lifecycle|generic_backend|generic_rows_from|preset_config_ipc|sglang_backend|vllm_backend)/)'
test-group = 'daemon-bound'

[[profile.ci.overrides]]
filter = 'binary(/^(session_|cli_integration|cli_bench)/)'
test-group = 'control-plane-bound'
